<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caesar Cipher | Encryption Application</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Caesar Cipher</h1>
            <p>Secure your messages with a simple shift</p>
        </header>

        <main>
            <section class="input-group">
                <label for="plainText">Your Message:</label>
                <textarea id="plainText" placeholder="Enter text to encrypt..."></textarea>
                
                <label for="shiftValue">Shift Key (Number):</label>
                <input type="number" id="shiftValue" placeholder="e.g. 3" value="3">
                
                <button id="cipher" class="btn-primary">Encrypt Text</button>
            </section>

            <section class="output-group">
                <h3>Result:</h3>
                <div id="card" class="display-box"></div>
                <button id="decipher" class="btn-secondary">Decrypt Result</button>
            </section>

          <section class="storage-group">
    <h3>Last Saved Encryption:</h3>
    <div id="card2" class="display-box"></div>
    <div class="button-group">
        <button id="decipherSaved" class="btn-secondary">Decipher Saved</button>
        <button id="clear" class="btn-danger">Clear History</button>
    </div>
</section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
